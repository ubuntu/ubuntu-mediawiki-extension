services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mediawiki
      MYSQL_USER: mediawiki
      MYSQL_PASSWORD: mediawiki
    volumes:
      - db-data:/var/lib/mysql

  mediawiki:
    image: mediawiki:1.46
    environment:
      # Passed to LocalSettings.php so $wgServer matches the published port.
      UBUNTU_WIKI_PORT: ${UBUNTU_WIKI_PORT:-8088}
    ports:
      # Default port 8088 avoids clashing with other environments on 8080.
      # Override with UBUNTU_WIKI_PORT=<port> to run multiple at once.
      - "${UBUNTU_WIKI_PORT:-8088}:80"
    volumes:
      # Extension files are served directly from this directory (live mount)
      - .:/var/www/html/extensions/UbuntuWiki
      # MobileFrontend is not bundled with the tarball; `make setup` clones
      # it into .ext/ (gitignored) and it is mounted here.
      - ./.ext/MobileFrontend:/var/www/html/extensions/MobileFrontend
      # The Ubuntu skin is shallow-cloned into .ext/ (gitignored) by
      # `make setup`/`make up` and mounted here.
      - ./.ext/UbuntuSkin:/var/www/html/skins/Ubuntu
      # LocalSettings.php is managed via: make deploy
    depends_on:
      - db

volumes:
  db-data:
