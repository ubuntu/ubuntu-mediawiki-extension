services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mediawiki
      MYSQL_USER: mediawiki
      MYSQL_PASSWORD: mediawiki
    volumes:
      - db-data:/var/lib/mysql

  mediawiki:
    image: mediawiki:1.46
    environment:
      # Passed to LocalSettings.php so $wgServer matches the published port.
      UBUNTU_EXT_PORT: ${UBUNTU_EXT_PORT:-8088}
    ports:
      # Default port 8088 avoids clashing with other environments on 8080.
      # Override with UBUNTU_WIKI_PORT=<port> to run multiple at once.
      - "${UBUNTU_EXT_PORT:-8088}:80"
    volumes:
      # Extension files are served directly from this directory (live mount)
      - .:/var/www/html/extensions/UbuntuWiki
      # composer.local.json pulls in test extensions and skins;
      # `make setup` / `make up` run composer inside the container to install it
      - ./composer.local.json:/var/www/html/composer.local.json
    depends_on:
      - db

volumes:
  db-data:
