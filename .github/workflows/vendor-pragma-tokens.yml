name: Update Pragma vendor files

# Vendors CSS from @canonical/design-tokens, @canonical/styles,
# @canonical/styles-typography, and normalize.css into
# resources/ext.ubuntu.styles/vendor/pragma/. See that directory's
# README.md for what's vendored, why, and its current wiring status.

on:
  push:
    branches:
      - main
    paths:
      - "package-lock.json"
  pull_request:
    paths:
      - "package-lock.json"
      - ".github/workflows/vendor-pragma-tokens.yml"
      - ".github/scripts/vendor-pragma-tokens.mjs"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: run the workflow but skip creating a PR"
        required: false
        default: false
        type: boolean

jobs:
  vendor:
    runs-on: ubuntu-latest

    permissions:
      contents: write # checkout repo + push the bot PR branch
      pull-requests: write # open / update the bot PR

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - run: npm ci

      - name: Vendor Pragma tokens/styles
        run: node .github/scripts/vendor-pragma-tokens.mjs

      - name: Upload vendor files as artifact
        uses: actions/upload-artifact@v7
        with:
          name: pragma-vendor
          path: resources/ext.ubuntu.styles/vendor/pragma/

      - name: Check for vendor file changes
        id: diff
        uses: canonical/desktop-engineering/gh-actions/common/has-diff@v2
        with:
          working-directory: resources/ext.ubuntu.styles/vendor/pragma
          fail-on-diff: "false"

      - name: Create pull request
        id: create-pr
        if: >-
          steps.diff.outputs.diff == 'true' &&
          github.event_name != 'pull_request' &&
          inputs.dry-run != true
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "deps(pragma): update vendor files"
          title: "deps(pragma): update vendor files"
          body: |
            Auto-generated update of vendored `@canonical/design-tokens`,
            `@canonical/styles`, `@canonical/styles-typography`, and
            `normalize.css`.

            **Triggered by:** ${{ github.event_name }} – [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Please verify the vendor files look correct before merging.
          branch: bot/update-pragma-vendor
          labels: dependencies
          delete-branch: true
          sign-commits: true

      - name: Create summary
        if: always()
        run: |
          echo "# Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Vendor file changes detected: ${{ steps.diff.outputs.diff }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull request: ${{ steps.create-pr.outputs.pull-request-url || 'N/A' }}" >> "$GITHUB_STEP_SUMMARY"
