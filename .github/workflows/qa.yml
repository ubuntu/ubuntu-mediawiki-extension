name: QA & sanity checks

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"] # Defaults for 24.04 and 26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      # Runs: parallel-lint (syntax), phpcs (MediaWiki coding standard),
      # minus-x (executable bits / shebang checks)
      - name: Run lint checks
        run: composer test

  json-lint:
    name: JSON lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON files
        run: |
          set -eo pipefail
          find . -name '*.json' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './.ext/*' \
            -print0 | while IFS= read -r -d '' f; do
              php -r "exit(json_decode(file_get_contents('$f')) === null && json_last_error() !== JSON_ERROR_NONE ? 1 : 0);" \
                || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "All JSON files valid."

  less-lint:
    name: LESS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install stylelint
        run: npm install --no-save stylelint stylelint-config-wikimedia

      - name: Lint LESS files
        run: npx stylelint "resources/**/*.less"

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Spin up the same docker environment used for local testing, then
      # install core's pinned phpunit in-container and run the suite there.
      - name: Start MediaWiki test environment
        run: make setup

      - name: Run unit tests
        run: make test-unit
